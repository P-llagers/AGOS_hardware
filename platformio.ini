[platformio]
default_envs = node_a

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

[env:usb_check]
build_flags = -DAGOS_MODE=0

[env:lora_receiver]
build_flags = -DAGOS_MODE=1
lib_deps = sandeepmistry/LoRa@0.8.0

[env:lora_sender]
build_flags = -DAGOS_MODE=2
lib_deps = sandeepmistry/LoRa@0.8.0

[env:gps_check]
build_flags = -DAGOS_MODE=3

; Both environments listen and send. Choose a different ID on each laptop.
[env:node_a]
build_flags = -DAGOS_MODE=4 -DAGOS_NODE_ID=65
lib_deps =
    sandeepmistry/LoRa@0.8.0
    mikalhart/TinyGPSPlus@1.0.3

[env:node_b]
extends = env:node_a
build_flags = -DAGOS_MODE=4 -DAGOS_NODE_ID=66
