[platformio]
default_envs = usb_check

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

[env:usb_check]
build_flags = -DAGOS_MODE=0

[env:lora_receiver]
build_flags = -DAGOS_MODE=1
lib_deps = sandeepmistry/LoRa@0.8.0

[env:lora_sender]
build_flags = -DAGOS_MODE=2
lib_deps = sandeepmistry/LoRa@0.8.0

[env:gps_check]
build_flags = -DAGOS_MODE=3
